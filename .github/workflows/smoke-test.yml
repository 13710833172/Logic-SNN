name: smoke-test

on:
  push:
  pull_request:

jobs:
  mnist-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training smoke test
        run: |
          python train.py \
            --dataset mnist \
            --device cpu \
            --epochs 1 \
            --batch-size 8 \
            --timesteps 2 \
            --num-workers 0 \
            --limit-train-batches 2 \
            --limit-val-batches 2

      - name: Run Logic-SNN unit tests
        run: python -m unittest discover -s tests -v

      - name: Run evaluation smoke test
        run: |
          LATEST_RUN="$(ls -td runs/mnist/* | head -n 1)"
          python test.py \
            --run-dir "$LATEST_RUN" \
            --inference both \
            --device cpu \
            --num-workers 0 \
            --limit-test-batches 2
